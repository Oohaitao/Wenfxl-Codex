version: '3.8'

services:
  codex-web:
    build: .
    image: wenfxl/wenfxl-codex-manager:local
    container_name: wenfxl_codex_manager
    ports:
      - "18000:8000"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST_PROJECT_PATH=${PWD}
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
